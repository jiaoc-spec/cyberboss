name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS runner: the sticker pipeline uses /usr/bin/sips and the check
    # script parses the Swift calendar helpers.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: node --test "test/*.test.js"
